name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os-name }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: static musl binaries via cargo-zigbuild
          - os: ubuntu-latest
            os-name: linux
            target: x86_64-unknown-linux-musl
            arch: x86_64
            zig: true
          - os: ubuntu-latest
            os-name: linux
            target: aarch64-unknown-linux-musl
            arch: aarch64
            zig: true
          - os: ubuntu-latest
            os-name: linux
            target: armv7-unknown-linux-musleabihf
            arch: armv7
            zig: true
          # macOS
          - os: macos-latest
            os-name: macos
            target: aarch64-apple-darwin
            arch: aarch64
          - os: macos-latest
            os-name: macos
            target: x86_64-apple-darwin
            arch: x86_64
          # Windows
          - os: windows-latest
            os-name: windows
            target: x86_64-pc-windows-msvc
            arch: x86_64
          - os: windows-latest
            os-name: windows
            target: aarch64-pc-windows-msvc
            arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: matrix.zig
        run: pip install cargo-zigbuild

      - name: Build (zigbuild)
        if: matrix.zig
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests
        if: matrix.os-name == 'linux' && matrix.arch == 'x86_64'
        run: cargo test

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ART="ytraceroute-${VERSION}-${{ matrix.os-name }}-${{ matrix.arch }}"
          tar czf "${ART}.tar.gz" -C "target/${{ matrix.target }}/release" ytraceroute

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME.Substring(1)
          $ART = "ytraceroute-$VERSION-${{ matrix.os-name }}-${{ matrix.arch }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/ytraceroute.exe" -DestinationPath "$ART.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytraceroute-${{ matrix.os-name }}-${{ matrix.arch }}
          path: ytraceroute-*
          if-no-files-found: error

  # A single job creates the release and attaches all assets; doing this
  # from every matrix job used to append the generated notes once per job.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
